[project]
name = "minesweeper"
description = "Minesweeper environment for Prime"
tags = ["minesweeper", "games"]
version = "0.1.10"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minesweeper"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 2
